<div class="posts-container">
  <h2 class="page-title">Enterprise Feed Updates</h2>
  
  <div class="action-bar">
    <button (click)="getAllPosts()">Get All Posts</button>
    <button (click)="getPostById(1)">Get Post by ID (1)</button>
  </div>

  <div class="posts-grid">
    @for (post of posts; track post.id) {
      <div class="post-card">
        <div class="card-header">
          <span class="post-id">#{{ post.id }}</span>
          <span class="user-tag">User ID: {{ post.userId }}</span>
        </div>
        <h3 class="card-title">{{ post.title }}</h3>
        <p class="card-body">{{ post.body }}</p>
      </div>
    } @empty {
      <div class="no-data-alert">
        <p>⚠️ No posts available at the moment. Please try again later.</p>
      </div>
    }
  </div>
</div>
